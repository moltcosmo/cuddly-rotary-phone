<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Print Job Manager</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f3f5f8}*{box-sizing:border-box}
body{margin:0}.top{background:#172b4d;color:white;padding:22px 18px 18px}.top small{opacity:.75}
main{padding:16px;max-width:720px;margin:auto}.panel{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #14213d0c}
h1{font-size:21px;margin:5px 0}h2{font-size:17px;margin:0 0 12px}.muted{color:#697386;font-size:13px}
input{width:100%;padding:12px;border:1px solid #d8dee9;border-radius:9px;margin:5px 0 12px;font-size:15px}
button{border:0;border-radius:9px;padding:11px 14px;background:#1769aa;color:white;font-weight:600;font-size:14px}
button.secondary{background:#e8eef5;color:#20334d}button.danger{background:#a83b3b}
.job{border:1px solid #e3e8ef;border-radius:11px;padding:13px;margin:10px 0}.jobhead{display:flex;justify-content:space-between;gap:10px}
.stage{display:inline-block;background:#eaf2fb;color:#15558b;border-radius:20px;padding:5px 9px;font-size:12px;margin:8px 0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{padding:9px 11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:24px;font-weight:700}.empty{text-align:center;padding:22px;color:#7b8494}
</style></head>
<body>
<header class="top"><small>PRINT SHOP • OFFLINE</small><h1>Print Job Manager</h1><div class="muted" style="color:#d8e2ef">Prototype 0.1 — data tersimpan di perangkat</div></header>
<main>
<section class="grid">
 <div class="panel"><div class="muted">Total order</div><div class="stat" id="total">0</div></div>
 <div class="panel"><div class="muted">Dalam proses</div><div class="stat" id="active">0</div></div>
</section>
<section class="panel">
<h2>Tambah pekerjaan</h2>
<label class="muted">Nama customer</label><input id="customer" placeholder="Contoh: Toko Maju">
<label class="muted">Jenis pekerjaan</label><input id="title" placeholder="Contoh: Brosur A4 2 sisi">
<label class="muted">Jumlah</label><input id="qty" type="number" min="1" value="500">
<button onclick="addJob()">+ Simpan order</button>
</section>
<section class="panel"><h2>Daftar pekerjaan</h2><div id="jobs"></div></section>
</main>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function refresh(){
 const jobs=JSON.parse(Android.listJobs());document.getElementById('total').textContent=jobs.length;
 document.getElementById('active').textContent=jobs.filter(j=>j.status!=='Completed').length;
 const el=document.getElementById('jobs');
 if(!jobs.length){el.innerHTML='<div class="empty">Belum ada pekerjaan. Tambahkan order pertama.</div>';return;}
 el.innerHTML=jobs.map(j=>`<article class="job">
 <div class="jobhead"><strong>${esc(j.title)}</strong><strong>#${j.id}</strong></div>
 <div class="muted">${esc(j.customer)} • ${j.qty} pcs</div>
 <div class="stage">${esc(j.stage)}</div>
 <div class="muted">Dibuat: ${esc(j.created_at)}</div>
 <div class="actions">
 ${j.stage==='Customer Approval'?`<button onclick="advance(${j.id})">Approve</button><button class="danger" onclick="reject(${j.id})">Reject</button>`:''}
 ${j.stage==='Artwork Revision'?`<button onclick="resubmit(${j.id})">Kirim ulang ke QC</button>`:''}
 ${j.stage!=='Customer Approval'&&j.stage!=='Artwork Revision'&&j.status!=='Completed'?`<button onclick="advance(${j.id})">Selesai tahap →</button>`:''}
 </div></article>`).join('');
}
function addJob(){
 const customer=document.getElementById('customer').value.trim(),title=document.getElementById('title').value.trim(),qty=Number(document.getElementById('qty').value);
 if(!customer||!title||qty<1){alert('Isi customer, pekerjaan, dan jumlah dengan benar.');return;}
 Android.createJob(customer,title,qty);document.getElementById('customer').value='';document.getElementById('title').value='';refresh();
}
function advance(id){Android.advanceJob(id);refresh();}
function reject(id){if(confirm('Customer menolak artwork? Pekerjaan dikembalikan untuk revisi.')){Android.rejectApproval(id);refresh();}}
function resubmit(id){Android.resubmitApproval(id);refresh();}
refresh();
</script></body></html>
